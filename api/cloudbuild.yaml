# Build context expected: repo root.
#
# PRODUCTION (defaults already target it):
#   cd ~/PRHOMZ-AI-DESIGNER
#   gcloud builds submit --config api/cloudbuild.yaml \
#     --substitutions=_IMAGE_TAG=v1 --project=prhomzmvp-nonprod .
#
# STAGING (must override the project-specific substitutions):
#   cd ~/PRHOMZ-AI-DESIGNER-staging
#   gcloud builds submit --config api/cloudbuild.yaml \
#     --substitutions=_IMAGE_BASE=us-central1-docker.pkg.dev/prhomzmvp-staging-505019/api/api,_IMAGE_TAG=v1,_SECRET_PROJECT=prhomzmvp-staging-505019 \
#     --project=prhomzmvp-staging-505019 .

steps:
  # Guard: the substitutions below default to PRODUCTION. Submitting this build
  # from the staging worktree without overriding them would push the image into
  # the production registry and read production's secret. Fail immediately
  # rather than let a cross-environment build succeed quietly.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        if [[ "${_IMAGE_BASE}" != *"/$PROJECT_ID/"* ]]; then
          echo "ERROR: _IMAGE_BASE targets a different project than this build." >&2
          echo "  _IMAGE_BASE = ${_IMAGE_BASE}" >&2
          echo "  build project = $PROJECT_ID" >&2
          echo "Pass --substitutions=_IMAGE_BASE=us-central1-docker.pkg.dev/$PROJECT_ID/api/api,_SECRET_PROJECT=$PROJECT_ID" >&2
          exit 1
        fi
        if [[ "${_SECRET_PROJECT}" != "$PROJECT_ID" ]]; then
          echo "ERROR: _SECRET_PROJECT (${_SECRET_PROJECT}) is not this build's project ($PROJECT_ID)." >&2
          exit 1
        fi
        echo "OK: building for $PROJECT_ID"

  # Download the GeoLite2-Country DB into the build context using the MaxMind
  # license key from Secret Manager, then bake it into the image (Dockerfile
  # COPY api/geodb/). The key never lands in the repo or the image.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    secretEnv: ['MAXMIND_LICENSE_KEY']
    args:
      - '-c'
      - |
        set -euo pipefail
        mkdir -p api/geodb
        echo "Downloading GeoLite2-Country DB from MaxMind..."
        curl -fsSL "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=$${MAXMIND_LICENSE_KEY}&suffix=tar.gz" -o /tmp/geolite.tgz
        tar -xzf /tmp/geolite.tgz -C /tmp
        cp /tmp/GeoLite2-Country_*/GeoLite2-Country.mmdb api/geodb/GeoLite2-Country.mmdb
        ls -la api/geodb/

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'api/Dockerfile'
      - '-t'
      - '${_IMAGE_BASE}:${_IMAGE_TAG}'
      - '-t'
      - '${_IMAGE_BASE}:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_IMAGE_BASE}']

substitutions:
  # Defaults target live (prhomzmvp-nonprod). Staging overrides all three on the
  # command line, so this one file serves both environments and stays safe to
  # promote staging -> main.
  _IMAGE_BASE: 'us-central1-docker.pkg.dev/prhomzmvp-nonprod/api/api'
  _IMAGE_TAG: 'v1'
  _SECRET_PROJECT: 'prhomzmvp-nonprod'

availableSecrets:
  secretManager:
    - versionName: 'projects/${_SECRET_PROJECT}/secrets/maxmind-license-key/versions/latest'
      env: 'MAXMIND_LICENSE_KEY'

images:
  - '${_IMAGE_BASE}:${_IMAGE_TAG}'
  - '${_IMAGE_BASE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
